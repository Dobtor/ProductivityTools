# dobtor_doc_editor — 靜態檢查（push / PR 都跑，而且會擋）
#
# 為什麼先上這一個：它不需要資料庫也不需要 Odoo，10 秒內跑完，而它擋得住
# 這個模組最常見、而且會讓「整個模組載不進去」的那幾類錯誤：
#   * XML 不 well-formed → ParseError，模組裝不起來
#   * manifest 不是合法的 Python literal → 同上
#   * flake8 的 E9/F63/F7/F82（語法錯、未定義名稱）→ import 期就炸
#
# 完整的 567 則後端測試在 dobtor_doc_editor_backend.yml（夜間），理由見那支。
name: dobtor_doc_editor static

on:
  push:
    paths: ['dobtor_doc_editor/**']
  pull_request:
    paths: ['dobtor_doc_editor/**']
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dobtor_doc_editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝檢查工具
        run: pip install flake8

      - name: XML 全部 well-formed
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          make ci-xml

      - name: manifest 是合法的 Python literal
        run: python3 -c "import ast; ast.literal_eval(open('__manifest__.py').read())"

      - name: flake8（只擋會讓 import 失敗的那幾類）
        run: |
          flake8 --max-line-length=120 --extend-ignore=E501,W503 \
                 --select=E9,F63,F7,F82 controllers models wizards tests

      - name: JS 語法（node --check 每一支）
        run: |
          set -e
          find static/src static/tests -name '*.js' \
            -not -path '*/lib/*' -print0 \
            | xargs -0 -n1 node --check
          echo "✓ 全部 JS 語法正確"

      - name: JS 純函式單測（node，無需瀏覽器）
        # 這個模組沒有 hoot 基礎設施，而 web.assets_unit_tests 要瀏覽器 runner
        # ——CI 刻意不跑瀏覽器。doc_editor_shared.js 零相依，node 可直接載入。
        # 守的是使用者可見的錯誤訊息（session 逾時的辨識）。
        run: |
          set -e
          for f in tests/js/*.mjs; do
            echo "── $f"
            node "$f"
          done

      - name: 資產與測試註冊的完整性
        # 這兩類是**靜默**的：assets 少一支檔案不會報錯、只是那支不執行；
        # tests/__init__.py 漏 import 則那批測試根本沒跑而結果仍然全綠。
        run: |
          python3 - <<'PY'
          import ast, glob, pathlib, re, sys
          root = pathlib.Path('.')
          man = ast.literal_eval(
              re.search(r'\{.*\}', (root / '__manifest__.py').read_text(), re.S).group(0))
          bad = []
          for bundle, paths in (man.get('assets') or {}).items():
              for p in paths:
                  if not isinstance(p, str):
                      continue
                  rel = p.split('/', 1)[1] if p.startswith('dobtor_doc_editor/') else p
                  if not glob.glob(str(root / rel)):
                      bad.append('%s → %s' % (bundle, p))
          miss = [d for d in man.get('data', []) if not (root / d).exists()]
          init = (root / 'tests/__init__.py').read_text()
          not_imported = [p.stem for p in sorted((root / 'tests').glob('test_*.py'))
                          if p.stem not in init]
          ok = True
          for label, items in (('assets 解析不到檔案', bad),
                               ('data 檔案不存在', miss),
                               ('tests/__init__.py 漏 import', not_imported)):
              if items:
                  ok = False
                  print('✗ %s：' % label)
                  for i in items:
                      print('    %s' % i)
          print('✓ assets / data / tests 註冊都完整' if ok else '')
          sys.exit(0 if ok else 1)
          PY
