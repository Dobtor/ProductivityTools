# dobtor_doc_editor — 後端測試（夜間 + 手動，**不擋** PR）
#
# 紀律 13：「test 寫好 + tag 對 + script 一鍵跑都不夠，沒人定期跑＝半 dead
# test」。這支就是那條紀律的 closure 的第一步。
#
# 升級到哪一步了（詞彙表的 v1/v2/v3）：
#   v1 手動 dispatch  ✓（Actions 頁可按）
#   v2 夜間           ✗ **還沒成立**——見下面「夜間為什麼不會跑」
#   v2.5 PR 上**跑但不擋**（continue-on-error）← 現在在這裡
#   v3 PR 上阻擋      ← 把下面 `continue-on-error` 那行刪掉就是
#
# ☠️ 夜間為什麼不會跑（2026-10-09 查證，原本這裡錯寫成 v2 已完成）：
#   GitHub 的 `schedule` 事件**只從 repo 的預設分支讀 workflow**。這個 repo
#   的預設分支是 `master`——而 `master` 是 2018-11-28 的單一提交、內容只有
#   `Readme.md`（repo 走的是每版一支分支：10.0 / dev-10.0 / dev-12.0 /
#   dev-14.0 / dev-18.0，master 是被遺棄的殘根）。
#
#   所以兩件事同時成立：
#     1. workflow 在 dev-18.0 上，夜間永遠不觸發。
#     2. 就算把這支檔案 cherry-pick 到 master，它會在一個沒有模組的樹上跑
#        `-i dobtor_doc_editor` → **每晚固定紅**。那比沒有 gate 更糟。
#
#   真正的修法是改 GitHub 的**預設分支設定**（指到 dev-18.0），那是 repo
#   設定不是程式碼。在那之前「夜間連續三次全綠才升 v3」的計時器沒有開始，
#   這支只能靠 PR 與手動 dispatch。
#
# 為什麼中間多一步 v2.5 而不是直接 v3：
#   * 紀律 13 的升級條件是「連續三次全綠」，那是**時間**換來的，不能跳過。
#   * 但「夜間綠了三次」只證明 main 是綠的，證明不了「PR 上跑得動」
#     （PR 的 checkout 路徑與權限不同）。所以先在 PR 上跑、結果只當資訊，
#     三次都綠再把 continue-on-error 拿掉。
#   * ☠️ 這支測試裡有一則已知的偶發失敗（HttpCase 在 --workers=0 下的
#     競爭，見 docs/qweb_converter_coverage.md §7.9）。阻擋式 gate 配上
#     偶發失敗等於訓練大家無視紅燈——那比沒有 gate 更糟。
#     所以 v3 的前提不只是「跑穩三次」，是**那一則偶發先解掉**。
#
# 為什麼不需要 checkout 別的 repo：這個模組的 depends 全部是核心 Odoo
#（base / web / mail / html_editor / bus / portal），原生報表整合測試用到的
# sale / account / stock / purchase 也都在核心 addons 裡。
#
# ☠️ 刻意**不**跑瀏覽器 tour：它需要 chromium + websocket-client，而且在
# arm64 與單 worker 環境有一串血淚（見 memory/odoo18_tour_rig_apple_silicon.md）。
# tour 目前仍然是本機 run_local_rig.sh tour 的責任。
name: dobtor_doc_editor backend

on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 台北 02:00
  workflow_dispatch:
  pull_request:
    paths:
      - 'dobtor_doc_editor/**'
      - '.github/workflows/dobtor_doc_editor_*.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # v2.5：PR 上跑但不擋。拿掉這一行就是 v3（前提見檔頭）。
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - name: 取出本 repo（放到 addons 目錄下）
        uses: actions/checkout@v4
        with:
          path: extra-addons/ProductivityTools

      - name: 取出 Odoo 18（shallow，只要原始碼）
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '18.0'
          depth: 1
          path: odoo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 系統套件（lxml / Pillow / ldap 要編譯）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxml2-dev libxslt1-dev libldap2-dev libsasl2-dev \
            libjpeg-dev zlib1g-dev libpq-dev

      - name: 安裝 Odoo 的 Python 依賴
        run: |
          pip install --upgrade pip wheel
          pip install -r odoo/requirements.txt
          # 選用套件：裝了這幾個，DOCX 匯出與 zip 防護的測試才會真的跑
          pip install python-docx odfpy

      - name: 安裝模組並跑測試
        id: run
        run: |
          set -o pipefail
          python odoo/odoo-bin \
            --addons-path=odoo/addons,extra-addons/ProductivityTools \
            -d ci_docedit \
            --db_host=localhost --db_user=odoo --db_password=odoo \
            -i dobtor_doc_editor,sale,account,stock,purchase \
            --test-enable --test-tags '/dobtor_doc_editor' \
            --without-demo= --workers=0 --max-cron-threads=0 \
            --http-port=8169 --stop-after-init --log-level=test \
            2>&1 | tee /tmp/ci.log

      - name: 判定（0 則測試也要算失敗）
        if: always()
        run: |
          line=$(grep -aE 'tests\.result:.*of [0-9]+ tests' /tmp/ci.log | tail -1)
          echo "$line"
          # ☠️ 一定要擋「0 則」：tag 打錯時 Odoo 會回報 0 failed 0 error of
          # 0 tests，不擋的話整份測試沒跑卻是綠的（本機 runner 踩過）。
          echo "$line" | grep -qE ': 0 failed, 0 error\(s\) of [1-9][0-9]* tests' \
            || { echo "::error::後端測試未全過（或根本沒跑）"; \
                 grep -aoE '(FAIL|ERROR): [A-Za-z0-9_.]+' /tmp/ci.log \
                   | sort | uniq -c | sort -rn | head -20; exit 1; }
          echo "✓ $line"

      - name: 失敗時留下 log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-test-log
          path: /tmp/ci.log
