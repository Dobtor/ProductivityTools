# pt-verify 的正式機目標（snapshot／deploy-plan／post-check 用；run 的 --target／--base prod:<目標> 也讀這裡）。
# 欄位：
#   name                       目標名（指令用）
#   deploy_mode                host＝本工具產遠端腳本、使用者用 ! 執行；control_panel＝走 CorPaaS 控制台（不產腳本）
#   ssh_host／ssh_key          唯讀快照與部署腳本用的 SSH
#   container／db              Odoo 容器與資料庫
#   sources_path               主機上的原碼根目錄（底下一層是各 repo 子目錄）
#   url                        站台網址（post-check 讀 /web/login；RPC 金鑰從環境變數 PT_VERIFY_RPC_KEY_<目標名大寫> 讀）
#   pause_crons                部署期間暫停的排程 xmlid（只動原本啟用的，結束恢復）
#   queue_busy_sql             等佇列閒置的查詢（回傳「忙碌中件數」；空字串＝不等）
#   kill_pattern               換碼前要結束的容器內子行程（pkill -f；空字串＝不動）
#   odoo_conf／container_log_dir  容器內 odoo.conf 與 log 目錄
# 值寫「待確認」的欄位一律留空字串：工具會拒絕需要它的動作，不會猜。

[[target]]
name = "admin.corpaas.com"
deploy_mode = "host"
ssh_host = "root@dobtor-cloudsql18.dobtor.com"
ssh_key = "~/dobtor-odoo18-cloudsql18"
container = "odoo-corpaas-prod_admin"
db = "CorPAAS_admin"
sources_path = "/opt/odoo/env00000036/Prod_admin/sources/Dobtor"
url = "https://admin.corpaas.com"
rpc_login = "admin"
pause_crons = [
  "dobtor_infrastructure.ir_cron_queue",
  "dobtor_corpaas_knowledge.ir_cron_knowledge_resume_orphans",
  "dobtor_corpaas_knowledge.cron_knowledge_autopilot",
]
queue_busy_sql = "select count(*) from corpaas_queue where state='processing' and coalesce(channel,'') <> 'knowledge'"
kill_pattern = "[o]doo shell --no-http"
odoo_conf = "/etc/odoo/odoo.conf"
container_log_dir = "/var/lib/odoo"

[[target]]
name = "admin.dobtor.com"
deploy_mode = "host"
ssh_host = "root@corpaas01.corpaas.com"
ssh_key = "~/dobtor-odoo18-cloudsql18"
container = "odoo-dobtor18-prod_admin"
db = "Dobtor18_admin"
# 原碼路徑：控制台 infrastructure.instance #49（Dobtor18-Prod_admin，主機 CorPAAS＝corpaas01）的 sources_path
# 加上 addons_path 的 Dobtor/ 層推得（2026-11-03 唯讀 RPC）；尚未 SSH 實地確認。OCA repo 在 sources/OCA（不在快照範圍）。
sources_path = "/opt/odoo/env00000115/Prod_admin/sources/Dobtor"
url = "https://admin.dobtor.com"
rpc_login = "admin"
pause_crons = []           # 待確認：此站是否也有佇列派工排程
queue_busy_sql = ""        # 待確認
kill_pattern = ""
odoo_conf = "/etc/odoo/odoo.conf"
container_log_dir = "/var/lib/odoo"

[[target]]
name = "demo-accounting"
deploy_mode = "control_panel"
control_panel_instance_id = 240
control_panel_database_id = 238
db = "demo_demo-accounting"
# 以下由控制台 infrastructure.instance #240（demo-Prod_demo-accounting，主機 CorPAAS＝corpaas01）唯讀 RPC 查得（2026-11-03）：
#   odoo_container、sources_path（＋addons_path 的 Dobtor/ 層）、main_hostname；容器內 log 檔 /etc/odoo/odoo.log。尚未 SSH 實地確認。
ssh_host = "root@corpaas01.corpaas.com"
ssh_key = "~/dobtor-odoo18-cloudsql18"
container = "odoo-demo-prod_demo-accounting"
sources_path = "/opt/odoo/env00000175/Prod_demo-accounting/sources/Dobtor"
url = "https://demo-accounting.corpaas.com"
rpc_login = "admin"
odoo_conf = "/etc/odoo/odoo.conf"
container_log_dir = "/var/lib/odoo"

